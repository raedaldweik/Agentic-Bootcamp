# Builds the Scoped MCP container and publishes it to GitHub Container Registry, so
# SAS Retrieval Agent Manager can pull it like it pulls ghcr.io/sassoftware/sas-mcp-server.
#
#   ghcr.io/raedaldweik/scoped-mcp:latest          every push that touches scoped_mcp/
#   ghcr.io/raedaldweik/scoped-mcp:sha-<commit>    the same build, pinned
#   ghcr.io/raedaldweik/scoped-mcp:<version>       when a tag scoped-mcp-v<version> is pushed
#
# First publish only: the package is created private. Make it public once (GitHub →
# your profile → Packages → scoped-mcp → Package settings → Change visibility), or RAM
# cannot pull it anonymously.
name: scoped-mcp image

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "scoped_mcp/**"
      - ".github/workflows/scoped-mcp-image.yml"
    tags: ["scoped-mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scoped-mcp
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=match,pattern=scoped-mcp-v(.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: scoped_mcp
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
