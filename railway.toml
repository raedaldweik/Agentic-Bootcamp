# Railway deployment of this branch: the Sanad MRO Intelligence Hub.
# Nothing to set in Railway beyond the variables (ANTHROPIC_API_KEY, and SANAD_ACCESS_CODE
# for a public address). Keep one replica: questions in flight are held in memory.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 120
numReplicas = 1
