# Same as railway.toml, for a service whose config path was set to this file.
# Nothing to set in Railway beyond the variables (ANTHROPIC_API_KEY, and SANAD_ACCESS_CODE
# for a public address). Keep one replica: questions in flight are held in memory.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.sanad"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 120
numReplicas = 1
