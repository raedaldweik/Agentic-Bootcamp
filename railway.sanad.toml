# Railway deployment of the Sanad MRO Intelligence Hub.
# In the Railway service settings, set the config file path to /railway.sanad.toml
# (the default railway.toml builds the hackathon app).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.sanad"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 120
numReplicas = 1
